name: Apache front proxy
on:
  workflow_dispatch:
  push:
    branches: [feat/apache-front-proxy]
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --ignore-scripts
      - run: >-
          bun x vitest run
          packages/adapters/src/infra/edge-listeners.test.ts
          packages/adapters/src/infra/edge-baked-conf.test.ts
          packages/adapters/src/system/proxy/consent-front-proxy.test.ts
          packages/adapters/src/system/proxy/detect.test.ts
          packages/adapters/src/system/proxy/ensure-container-edge.test.ts
      - run: bun x vitest run packages/adapters/src/infra/nginx.test.ts -t 'Apache front proxy'
      - run: docker build -f apps/edge/Dockerfile -t openship-edge:apache-test .
      - run: bash scripts/test-apache-edge.sh
